name: Original signing key recovery check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect-original-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.gradle/caches
            /home/runner/.gradle/wrapper
          key: setup-java-Linux-x64-gradle-84fc3a7ea6385c8faafd658bbf52bf095d03120d80f28a323a4b27aaf2775f26
      - name: Inspect cached signing keys without exporting private material
        run: |
          find "$HOME/.gradle" -type f \( -iname '*.keystore' -o -iname '*.jks' -o -iname '*.p12' \) -print0 | while IFS= read -r -d '' signing_file; do
            printf 'Candidate: %s\n' "$signing_file"
            keytool -list -keystore "$signing_file" -storepass android || true
          done
