name: Android cloud build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Restore stable personal APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MONTHMARK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing stable signing key; refusing to create an incompatible APK.'; exit 1; }
          signing_file="$RUNNER_TEMP/monthmark.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          chmod 600 "$signing_file"
          echo "MONTHMARK_KEYSTORE_PATH=$signing_file" >> "$GITHUB_ENV"
      - name: Test date rules, lint, and build APK
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:signingReport --no-daemon
      - name: Verify the published signing certificate
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/apk-certificate.txt"
          grep -Fqi 'cdd9e68e855692314914c26f691501acc2c94cb23e59e87ca9d3d210b29b4469' "$RUNNER_TEMP/apk-certificate.txt"
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test launcher placement and widgets on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/emulator-tests.sh
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: monthmark-apk-api-${{ matrix.api-level }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-and-screenshots-api-${{ matrix.api-level }}
          path: |
            core/build/reports/tests/
            app/build/reports/
            screenshots/
